services:
  # =========================================================
  # PHASE 1: libcoap Baseline Testing (Puerto 5684)
  # =========================================================
  dtls-server:
    build: .
    image: iiot-base-image
    container_name: iiot-dtls-server
    volumes:
      - ../traces:/traces
      - ./certs/server:/certs
      - ../scripts/server:/scripts/app               # 🚀 Mapeo único
      - ../scripts/setup-network:/scripts/setup       # 🚀 Mapeo único
    cap_add:
      - NET_ADMIN
    command: >
      /bin/bash -c "
      if [ '${SCENARIO:-A}' = 'B' ]; then /bin/bash /scripts/setup/limited-network.sh; fi &&
      exec /bin/bash /scripts/app/run.sh dtls_${SCENARIO:-A} coap-server -v 9 -A 0.0.0.0 -p 5683 -c /certs/server.crt -j /certs/server.key -R /certs/ca.crt
      "

  dtls-client:
    build: .
    image: iiot-base-image
    container_name: iiot-dtls-client
    volumes:
      - ./certs/client:/certs
      - ../scripts/client:/scripts/app
      - ../scripts/setup-network:/scripts/setup
    cap_add:
      - NET_ADMIN
    depends_on:
      - dtls-server
    command: >
      /bin/bash -c "
      if [ '${SCENARIO:-A}' = 'B' ]; then /bin/bash /scripts/setup/limited-network.sh; fi &&
      exec /bin/bash /scripts/app/run.sh coap-client -v 9 -m get -c /certs/client.crt -j /certs/client.key -R /certs/ca.crt coaps://iiot-dtls-server:5684/
      "

  # =========================================================
  # PHASE 2: Custom App Testing (Puerto 8080 o el tuyo)
  # =========================================================
  edhoc-server:
    build: .
    image: iiot-base-image
    container_name: iiot-edhoc-server
    volumes:
      - ../../build/bin:/app
      - ../traces:/traces
      - ../scripts/server:/scripts/app
      - ../scripts/setup-network:/scripts/setup
    cap_add:
      - NET_ADMIN
    command: >
      /bin/bash -c "
      if [ '${SCENARIO:-A}' = 'B' ]; then /bin/bash /scripts/setup/limited-network.sh; fi &&
      exec /bin/bash /scripts/app/run.sh edhoc_${SCENARIO:-A} /app/server -p 2 -s 2
      "

  edhoc-client:
    build: .
    image: iiot-base-image
    container_name: iiot-edhoc-client
    volumes:
      - ../../build/bin:/app
      - ../scripts/client:/scripts/app
      - ../scripts/setup-network:/scripts/setup
    cap_add:
      - NET_ADMIN
    depends_on:
      - edhoc-server
    command: >
      /bin/bash -c "
      if [ '${SCENARIO:-A}' = 'B' ]; then /bin/bash /scripts/setup/limited-network.sh; fi &&
      exec /bin/bash /scripts/app/run.sh /app/client -p 2 -s 2 iiot-edhoc-server
      "